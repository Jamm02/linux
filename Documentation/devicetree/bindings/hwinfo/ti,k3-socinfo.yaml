%YAML 1.2
---
$id: http://devicetree.org/schemas/hwinfo/ti,k3-socinfo.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments K3 Multicore SoC platforms chipid module

maintainers:
  - Tero Kristo <t-kristo@ti.com>
  - Nishanth Menon <nm@ti.com>

description: |
  Texas Instruments (ARM64) K3 Multicore SoC platforms chipid module is
  represented by CTRLMMR_xxx_JTAGID register which contains information about
  SoC id and revision.

  On some SoCs like AM62P, the silicon revision is determined by reading
  alternative registers via NVMEM cells.

properties:
  $nodename:
    pattern: "^chipid(@[0-9a-f]+)?$"

  compatible:
    items:
      - enum:
          - ti,am654-chipid
          - ti,tda54-chipid

  reg:
    maxItems: 1

  ti,syscon-chipid:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      Phandle to the syscon covering the JTAGID register, and the byte
      offset of the JTAGID register within that syscon's address range.
    items:
      - items:
          - description: Phandle to syscon covering the JTAGID register
          - description: Offset of the JTAGID register

  nvmem-cells:
    items:
      - description: Alternate silicon revision register

  nvmem-cell-names:
    items:
      - const: gpsw1

required:
  - compatible

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ti,tda54-chipid
    then:
      properties:
        reg: false
      required:
        - ti,syscon-chipid
    else:
      properties:
        ti,syscon-chipid: false
      required:
        - reg

examples:
  - |
    chipid@43000014 {
        compatible = "ti,am654-chipid";
        reg = <0x43000014 0x4>;
    };

  - |
    chipid {
        compatible = "ti,tda54-chipid";
        ti,syscon-chipid = <&scm_conf 0x14>;
    };
